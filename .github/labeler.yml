# Mapeamento de labels automáticas por área do código
# Usado pelo actions/labeler@v5 no workflow pr-labeler.yml
# Referência: https://github.com/actions/labeler

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/app/**'
          - 'web/components/**'
          - 'web/theme/**'
          - '**/*.css'
          - '**/*.jsx'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/services/**'
          - 'web/lib/**'
          - 'web/hooks/**'
          - 'web/store/**'
          - 'web/utils/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.test.jsx'
          - '**/*.test.js'
          - '**/*.spec.jsx'
          - '**/*.spec.js'
          - 'web/e2e/**'
          - 'web/playwright.config.*'
          - 'web/vitest.config.*'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'web/docs/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - 'web/package.json'
          - 'web/pnpm-lock.yaml'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/next.config.mjs'
          - 'web/vercel.json'
          - 'web/.env.example'
