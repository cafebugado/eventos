# Mapeamento de labels automáticas por área do código
# Usado pelo actions/labeler@v5 no workflow pr-labeler.yml
# Referência: https://github.com/actions/labeler

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'components/**'
          - 'theme/**'
          - '**/*.css'
          - '**/*.jsx'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'services/**'
          - 'lib/**'
          - 'hooks/**'
          - 'store/**'
          - 'utils/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.test.jsx'
          - '**/*.test.js'
          - '**/*.spec.jsx'
          - '**/*.spec.js'
          - 'e2e/**'
          - 'playwright.config.*'
          - 'vitest.config.*'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'pnpm-lock.yaml'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'next.config.mjs'
          - 'vercel.json'
          - '.env.example'
